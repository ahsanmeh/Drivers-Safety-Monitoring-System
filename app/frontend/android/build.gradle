// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
    minSdkVersion = findProperty('android.minSdkVersion') ?: 26
    compileSdkVersion = findProperty('android.compileSdkVersion') ?: 35
    targetSdkVersion = findProperty('android.targetSdkVersion') ?: 35
    kotlinVersion = '2.1.0'
    ndkVersion = findProperty('android.ndkVersion') ?: '27.0.12077973'
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}


apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
